name: Keep Dropzyy Alive

on:
  schedule:
    # Runs every 10 minutes 24/7 to prevent Render free-tier inactivity sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Dropzyy Production
        run: |
          echo "Pinging Dropzyy Production Services..."
          curl -s -o /dev/null -w "dropzyy.in: %{http_code}\n" https://www.dropzyy.in/ || true
          curl -s -o /dev/null -w "dropzyy.in/ping: %{http_code}\n" https://www.dropzyy.in/ping || true
          curl -s -o /dev/null -w "freshkart-9j9b/ping: %{http_code}\n" https://freshkart-9j9b.onrender.com/ping || true
          echo "Keep-alive ping completed successfully!"
