name: Keep-Alive Pinger

on:
  schedule:
    # Runs every 10 minutes 24/7 to prevent free cloud hosts (Render/Koyeb/Glitch) from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Keep-Alive Endpoint
        env:
          TARGET_URL: ${{ secrets.PRODUCTION_URL || 'https://www.dropzyy.in' }}
        run: |
          echo "Sending keep-alive ping to ${TARGET_URL}/ping..."
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X GET "${TARGET_URL}/ping")
          echo "HTTP Response Status: ${RESPONSE_CODE}"
          if [ "$RESPONSE_CODE" -ge 200 ] && [ "$RESPONSE_CODE" -lt 400 ]; then
            echo "Keep-alive ping succeeded! Host is active."
          else
            echo "Primary URL ping returned ${RESPONSE_CODE}. Trying fallback URL..."
            FALLBACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X GET "https://dropzyy.onrender.com/ping")
            echo "Fallback HTTP Response Status: ${FALLBACK_CODE}"
          fi
